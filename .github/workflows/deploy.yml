# CI + deploy to Cloudflare Workers.
#
# Every push and pull request: typecheck, unit tests, production build (no secrets).
# Push to the default branch (or "Run workflow"): load secrets from Bitwarden
# Secrets Manager, make sure D1 + the queue exist, apply D1 migrations, deploy.
#
# The only GitHub secret is BWS_ACCESS_TOKEN: a Bitwarden Secrets Manager machine
# account access token. Everything else (Cloudflare credentials, GitHub App
# secrets, APP_URL, …) comes from Bitwarden through bitwarden/sm-action; the
# secret-ID → env-var mapping is in the "Load secrets from Bitwarden" step.
# See README → "Deploy with GitHub Actions".
#
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   BWS_CLOUD_REGION  "eu" for vault.bitwarden.eu (default "us")
name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Bitwarden's documented step: https://github.com/bitwarden/sm-action
      # Each line maps a Bitwarden secret ID (Secrets Manager → Secrets → the
      # secret → copy its ID; not sensitive) to the env var it becomes. Values are
      # masked in logs. Replace every placeholder ID before the first deploy.
      - name: Check the Bitwarden secret IDs are filled in
        run: |
          if grep -Eq '^ +0{8}-0{4}-0{4}-0{4}-0{10}[0-9]{2} >' .github/workflows/deploy.yml; then
            echo "::error file=.github/workflows/deploy.yml::Replace the placeholder Bitwarden secret IDs in the 'Load secrets from Bitwarden' step."
            exit 1
          fi

      - name: Load secrets from Bitwarden
        uses: bitwarden/sm-action@v3
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BWS_CLOUD_REGION || 'us' }}
          secrets: |
            00000000-0000-0000-0000-000000000001 > CLOUDFLARE_API_TOKEN
            00000000-0000-0000-0000-000000000002 > CLOUDFLARE_ACCOUNT_ID
            00000000-0000-0000-0000-000000000003 > APP_URL
            00000000-0000-0000-0000-000000000004 > SESSION_SECRET
            00000000-0000-0000-0000-000000000005 > LWC_SECRET
            00000000-0000-0000-0000-000000000006 > GITHUB_APP_ID
            00000000-0000-0000-0000-000000000007 > GITHUB_APP_SLUG
            00000000-0000-0000-0000-000000000008 > GITHUB_APP_PRIVATE_KEY
            00000000-0000-0000-0000-000000000009 > GITHUB_CLIENT_ID
            00000000-0000-0000-0000-000000000010 > GITHUB_CLIENT_SECRET
            00000000-0000-0000-0000-000000000011 > GITHUB_WEBHOOK_SECRET

      - name: Provision D1 database and queue
        run: node scripts/ci/provision.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply openscan --remote

      - name: Build
        run: npm run build

      - name: Deploy Worker with secrets
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets" "$secrets.vars"' EXIT
          node scripts/ci/worker-secrets.mjs "$secrets"
          args=()
          while IFS= read -r v; do [ -n "$v" ] && args+=(--var "$v"); done < "$secrets.vars"
          npx wrangler deploy --secrets-file "$secrets" "${args[@]}"
