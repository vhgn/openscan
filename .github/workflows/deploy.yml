# CI + deploy to Cloudflare Workers.
#
# Every push and pull request: typecheck, unit tests, production build (no secrets).
# Push to main (or "Run workflow" on main): load secrets from Bitwarden
# Secrets Manager, make sure D1 + the queue exist, apply D1 migrations, deploy.
#
# The only GitHub secret is BWS_ACCESS_TOKEN: a Bitwarden Secrets Manager machine
# account access token. Everything else (Cloudflare credentials, GitHub App
# secrets, APP_URL, …) comes from Bitwarden through bitwarden/sm-action; the
# secret-ID → env-var mapping is in the "Load secrets from Bitwarden" step.
# See docs/TECHNICAL.md → "Deploy to Cloudflare".
#
# Optional repository variable (Settings → Secrets and variables → Actions → Variables):
#   BWS_CLOUD_REGION  "eu" for vault.bitwarden.eu (default "us")
name: CI / Deploy

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  deploy:
    name: Deploy to Cloudflare
    needs: check
    # Production deploys come only from main (a push, or "Run workflow" on main).
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Bitwarden's documented step: https://github.com/bitwarden/sm-action
      # Each line maps a Bitwarden secret ID (Secrets Manager → Secrets → the
      # secret → copy its ID; not sensitive) to the env var it becomes. Values are
      # masked in logs. All IDs are in the Bitwarden project "OpenScan".
      - name: Load secrets from Bitwarden
        uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: ${{ vars.BWS_CLOUD_REGION || 'us' }}
          secrets: |
            b2ada4f0-d843-4cd8-a897-b4f9013afe17 > CLOUDFLARE_API_TOKEN
            af427321-b9b4-4e26-a753-b4f90131ea82 > CLOUDFLARE_ACCOUNT_ID
            efc767ef-e5f1-4976-89bb-b4f90131bc4a > APP_URL
            6093f795-4719-4760-836d-b4f900e2ff65 > SESSION_SECRET
            c238c477-efa4-4bd4-a29a-b4f900e317c6 > LWC_SECRET
            fea6502e-449e-47fe-b2d3-b4f901313593 > GITHUB_APP_ID
            57872c5c-0e64-433a-a278-b4f901319c8d > GITHUB_APP_SLUG
            35700457-95b2-48d8-b98b-b4f901318c10 > GITHUB_APP_PRIVATE_KEY
            1a470d4d-55fa-4b97-9d44-b4f9013141a6 > GITHUB_CLIENT_ID
            0d90312f-35e8-4df2-a7af-b4f901315bfc > GITHUB_CLIENT_SECRET
            7ee9a096-f3bc-40d4-a370-b4f901303433 > GITHUB_WEBHOOK_SECRET

      - name: Provision D1 database and queue
        run: node scripts/ci/provision.mjs

      - name: Apply D1 migrations
        run: npx wrangler d1 migrations apply openscan --remote

      - name: Build
        run: npm run build

      - name: Deploy Worker with secrets
        run: |
          set -euo pipefail
          secrets="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets" "$secrets.vars"' EXIT
          node scripts/ci/worker-secrets.mjs "$secrets"
          args=()
          while IFS= read -r v; do [ -n "$v" ] && args+=(--var "$v"); done < "$secrets.vars"
          npx wrangler deploy --secrets-file "$secrets" "${args[@]}"
